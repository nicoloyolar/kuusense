name: kuusense_firebase
description: Firebase bootstrap and data repository shared by the Kuusense apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_storage: ^14.1.0
  flutter:
    sdk: flutter
  kuusense_models:
    path: ../kuusense_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
